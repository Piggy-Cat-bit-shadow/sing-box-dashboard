name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # `src/lib/subscription.test.ts` reaches the `Subscription-Userinfo` parser through the
      # `@shared` alias, which `tsconfig.json` and `vite.config.ts` declare as `../src/shared`:
      # the desktop shell, where that parser belongs because that is where the fetch happens.
      # A standalone checkout of THIS repository has no such sibling, so `tsc -b` stops with
      # TS2307 and nothing can be deployed. Reproduce the layout the sources are written for,
      # pinned to the shell revision whose own `dashboard` submodule names this repository's
      # `main` - a given dashboard commit then always builds against the same shell.
      - name: Materialise the desktop shell sources the `@shared` alias names
        env:
          SHELL_SHA: eb2dbf8ba7de0bb4f37e524dada0f30c38417282
        run: |
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/Piggy-Cat-bit-shadow/sing-box-for-desktop.git \
            "$GITHUB_WORKSPACE/../src"
          git -C "$GITHUB_WORKSPACE/../src" checkout --quiet "$SHELL_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish-branch:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Push dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
